<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bizzy">
<meta name="theme-color" content="#ffffff">
<title>Bizzy · Web Summit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root {
  --accent:      #F30C5F;
  --accent-soft: rgba(243,12,95,.09);
  --accent-mid:  rgba(243,12,95,.22);
  --yellow:      #F5E000;
  --surface:     #FFFFFF;
  --sf2:         #F7F5F1;
  --border:      #ECEAE3;
  --bsoft:       #F1EFE8;
  --t1: #1A1915; --t2: #57554E; --t3: #8F8C84; --t4: #B5B2A8;
  --font: 'Manrope', system-ui, sans-serif;
  --font-display: 'Fraunces', Georgia, serif;
  --font-mono: 'JetBrains Mono', monospace;
  /* safe-area insets */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  color: var(--t1);
  background: var(--sf2);
  height: 100%;
  /* Full screen app layout */
  display: flex;
  flex-direction: column;
  overflow: hidden;
  /* Prevent pull-to-refresh bounce */
  overscroll-behavior: none;
}

/* ── APP SHELL ── */
/* Fixed header — app bar stays pinned at top */
.app-header {
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--bsoft);
  /* Push content below status bar on iOS */
  padding-top: max(var(--sat), 12px);
  position: relative;
  z-index: 20;
}

/* Scrollable content fills the middle */
.app-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  display: flex;
  flex-direction: column;
}
.app-body::-webkit-scrollbar { display: none; }

/* Fixed footer — composer + tabs stay pinned at bottom */
.app-footer {
  flex-shrink: 0;
  background: rgba(255,255,255,.97);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-top: 1px solid var(--bsoft);
  /* Push content above home indicator on iOS */
  padding-bottom: max(var(--sab), 0px);
}

/* ── APP BAR ── */
.abar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 12px;
}
.abar-l { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--yellow);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.evname { font-size: 13px; font-weight: 700; color: var(--t1); line-height: 1.2; letter-spacing: -.2px; }
.evdate { font-size: 10.5px; font-weight: 500; color: var(--t3); }
.abar-r { display: flex; gap: 4px; align-items: center; }
.ibtn {
  width: 36px; height: 36px; border-radius: 50%; border: 0;
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--t1); position: relative; transition: background .15s;
  -webkit-tap-highlight-color: transparent;
}
.ibtn:active { background: var(--sf2); }
.bell::after {
  content: ''; position: absolute; top: 7px; right: 7px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); border: 2px solid #FFF;
}
.ava {
  width: 32px; height: 32px; border-radius: 50%;
  overflow: hidden; cursor: pointer; flex-shrink: 0;
}
.ava img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }

/* ── ANCHOR CARD ── */
.anchor-wrap {
  background: var(--surface);
  padding: 12px 16px 0;
  flex-shrink: 0;
  border-bottom: 1px solid var(--bsoft);
}
.acard {
  border-radius: 20px; padding: 13px 15px;
  display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
  cursor: pointer; transition: opacity .15s; position: relative; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.acard::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.06) 0%, transparent 60%);
  pointer-events: none;
}
.acard:active { opacity: .88; }
.acard.live { background: linear-gradient(135deg, #0B4FB8, #128EF3); }
.aicon {
  width: 40px; height: 40px; border-radius: 11px;
  background: rgba(255,255,255,.14);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.abody { flex: 1; min-width: 0; }
.alabel {
  font-size: 9.5px; font-weight: 700; letter-spacing: 1.3px;
  text-transform: uppercase; color: rgba(255,255,255,.45);
  margin-bottom: 2px; font-family: var(--font-mono);
}
.amain { font-size: 14px; font-weight: 700; letter-spacing: -.3px; line-height: 1.25; color: #FFF; }
.asub { font-size: 11px; font-weight: 500; color: rgba(255,255,255,.55); margin-top: 2px; }
.acta {
  background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.25);
  color: #FFF; font-family: var(--font); font-size: 11.5px; font-weight: 700;
  padding: 8px 13px; border-radius: 9px; cursor: pointer;
  white-space: nowrap; flex-shrink: 0; transition: background .15s;
  -webkit-tap-highlight-color: transparent;
}
.acta:active { background: rgba(255,255,255,.32); }

/* ── EVENT BANNER ── */
.event-banner { position: relative; height: 100px; overflow: hidden; flex-shrink: 0; }
.event-banner-bg { position: absolute; inset: 0; }
.event-banner-pattern {
  position: absolute; inset: 0; opacity: .18;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.15) 0, rgba(255,255,255,.15) 1px, transparent 0, transparent 50%);
  background-size: 20px 20px;
}
.event-banner-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(10,20,40,.72) 0%, rgba(10,20,40,.2) 60%, transparent 100%);
}
.event-banner-text { position: absolute; bottom: 11px; left: 16px; right: 16px; }
.eb-eyebrow {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 1.4px;
  text-transform: uppercase; color: rgba(255,255,255,.65);
  display: flex; align-items: center; gap: 6px; margin-bottom: 3px;
}
.eb-title {
  font-family: var(--font-display); font-size: 18px; font-weight: 600;
  color: #FFF; line-height: 1.1; letter-spacing: -.3px;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #19C37D;
  animation: lp 1.6s infinite;
}
@keyframes lp {
  0%   { box-shadow: 0 0 0 0 rgba(25,195,125,.55); }
  70%  { box-shadow: 0 0 0 6px rgba(25,195,125,0); }
  100% { box-shadow: 0 0 0 0 rgba(25,195,125,0); }
}

/* ── BIZZY DIVIDER ── */
.bdiv { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; flex-shrink: 0; }
.bline { flex: 1; height: 1px; background: var(--border); }
.bbadge {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 10px 5px 8px;
  font-size: 11px; font-weight: 700; color: var(--t2);
}
.bglyph {
  width: 18px; height: 18px; border-radius: 50%; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.ldot { width: 6px; height: 6px; border-radius: 50%; background: #19C37D; display: inline-block; animation: lp 1.6s infinite; }
.rbtn {
  width: 28px; height: 28px; border-radius: 50%; border: 0;
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--t3); transition: background .15s, color .15s;
  -webkit-tap-highlight-color: transparent;
}
.rbtn:active { background: var(--sf2); color: var(--t1); }

/* ── SUGGEST CHIPS ── */
.suggest-area { padding: 0 16px 8px; }
.suggest-label {
  font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--t3); font-family: var(--font-mono);
  margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
}
.suggest-list { display: flex; flex-direction: column; gap: 6px; }
.suggest-chip {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 11px 16px;
  font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--t1);
  cursor: pointer; text-align: left; white-space: nowrap;
  transition: border-color .15s, background .15s;
  -webkit-tap-highlight-color: transparent;
}
.suggest-chip:active { background: var(--accent-soft); border-color: var(--accent-mid); color: var(--accent); }
.s-icon { color: var(--accent); display: inline-flex; flex-shrink: 0; }

/* ── HOME BODY SECTIONS ── */
.home-section { padding: 0 16px 16px; }
.home-section-title {
  font-family: var(--font-display); font-size: 17px; font-weight: 600;
  letter-spacing: -.3px; margin-bottom: 10px; color: var(--t1);
}
.page-section { padding: 12px 16px 8px; }
.page-section-title {
  font-size: 10.5px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: var(--t3); font-family: var(--font-mono); margin-bottom: 10px;
}

/* ── COMPOSER (inside footer) ── */
.composer { padding: 10px 14px 10px; }
.crow {
  display: flex; align-items: center; gap: 8px;
  background: var(--sf2); border-radius: 999px;
  padding: 6px 6px 6px 16px;
  border: 1px solid var(--border);
}
.crow input {
  flex: 1; background: transparent; border: 0;
  font-family: var(--font); font-size: 15px; color: var(--t1);
  padding: 8px 0; outline: none;
  /* Prevent iOS zoom on focus */
  font-size: 16px;
}
.crow input::placeholder { color: var(--t3); }
.sbtn {
  width: 38px; height: 38px; border-radius: 50%; border: 0;
  background: var(--t1); color: #FFF; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.sbtn:active { background: #000; }

/* ── TAB BAR (inside footer) ── */
.tabbar {
  display: flex; justify-content: space-around;
  padding: 4px 8px 0;
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 14px 8px; border: 0; background: transparent;
  cursor: pointer; color: var(--t3); font-size: 10px; font-weight: 600;
  font-family: var(--font); flex: 1; transition: color .15s;
  -webkit-tap-highlight-color: transparent;
}
.tab:active, .tab.on { color: var(--t1); }
.tab svg { width: 22px; height: 22px; }

/* ── BIZZY CARDS ── */
.bzc {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 14px;
  cursor: pointer; transition: border-color .15s;
  -webkit-tap-highlight-color: transparent;
}
.bzc:active { border-color: var(--accent-mid); }
.bzc-ph { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--sf2); }
.bzc-ph img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
.bzc-body { flex: 1; min-width: 0; }
.bzc-name { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: -.2px; color: var(--t1); line-height: 1.2; }
.bzc-role { font-size: 12px; color: var(--t2); margin-top: 2px; line-height: 1.35; }
.bzc-meta { font-size: 11.5px; color: var(--t3); margin-top: 4px; display: flex; align-items: center; gap: 5px; line-height: 1.3; }
.bzc-hint { font-size: 11.5px; color: var(--t2); margin-top: 5px; font-style: italic; line-height: 1.35; }
.bzc-muts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.bzc-mut { font-size: 10.5px; background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 999px; font-weight: 600; }
.bzc-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.bzc-btn {
  font-family: var(--font); font-size: 12px; font-weight: 700;
  padding: 7px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--t1); cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  transition: background .15s; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.bzc-btn:active { background: var(--sf2); }
.bzc-btn-primary { background: var(--t1); color: #FFF; border-color: var(--t1); }
.bzc-btn-primary:active { background: #000; }
.bzc-btn-soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.bzc-btn-soft:active { background: var(--accent-mid); }
.bzc-tag { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; font-weight: 600; margin-bottom: 4px; }
.bzc-tag-live { background: rgba(220,38,38,.10); color: #B91C1C; }
.bzc-tag-next { background: rgba(243,12,95,.10); color: var(--accent); }
.bzc-dot { width: 5px; height: 5px; border-radius: 50%; background: #DC2626; animation: bpulse 1.4s infinite; }
@keyframes bpulse { 0%{box-shadow:0 0 0 0 rgba(220,38,38,.6);}70%{box-shadow:0 0 0 5px rgba(220,38,38,0);}100%{box-shadow:0 0 0 0 rgba(220,38,38,0);} }
.bzc-session .bzc-time { width: 44px; flex-shrink: 0; text-align: center; background: var(--sf2); border-radius: 10px; padding: 7px 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.bzc-time-num { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1; color: var(--t1); }
.bzc-time-min { font-family: var(--font-mono); font-size: 10px; color: var(--t3); margin-top: 2px; letter-spacing: .5px; }
.bzc-map { width: 52px; height: 52px; border-radius: 10px; overflow: hidden; flex-shrink: 0; }
.bzc-map svg { width: 100%; height: 100%; display: block; }
.bzc-wifi { align-items: center; }
.bzc-wifi-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.bzc-wifi-row { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; line-height: 1.5; }
.bzc-wifi-lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--t3); width: 62px; flex-shrink: 0; }
.bzc-wifi-val { font-family: var(--font-mono); font-weight: 500; color: var(--t1); }
.bzc-logo { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg,var(--t1),#444); color: #FFF; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 20px; flex-shrink: 0; }
.bzc-schedule { flex-direction: column; gap: 0; padding: 4px 12px; }
.bzc-sch-row { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--border); }
.bzc-sch-row:last-child { border-bottom: 0; }
.bzc-sch-time { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--t1); width: 42px; flex-shrink: 0; }
.bzc-sch-title { font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--t1); display: flex; align-items: center; gap: 8px; }
.bzc-sch-meta { font-size: 11.5px; color: var(--t3); margin-top: 2px; }
.spk-card { border-radius: 14px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.spk-card:active { opacity: .92; }
.spk-card-img { height: 120px; overflow: hidden; position: relative; }
.spk-card-av { position: absolute; bottom: -20px; left: 14px; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; border: 3px solid #FFF; box-shadow: 0 2px 8px rgba(0,0,0,.14); }
.spk-card-av img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
.spk-card-body { padding: 26px 14px 12px; background: var(--surface); }
.spk-card-name { font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--t1); }
.spk-card-role { font-size: 12px; color: var(--t2); margin-top: 1px; }
.spk-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.spk-card-session { font-size: 11px; color: var(--t3); display: flex; align-items: center; gap: 4px; }

/* ── MODAL ── */
.scrim {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4); opacity: 0; pointer-events: none;
  transition: opacity .22s; z-index: 60;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.modal {
  position: fixed; left: 12px; right: 12px;
  bottom: max(var(--sab), 10px);
  max-height: 80vh;
  background: var(--surface); border-radius: 28px;
  z-index: 70; transform: translateY(120%);
  transition: transform .32s cubic-bezier(.2,.7,.2,1);
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 -8px 40px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.04);
}
.modal.open { transform: translateY(0); }
.modal-grip { width: 36px; height: 4px; background: var(--t4); border-radius: 999px; margin: 10px auto 4px; flex-shrink: 0; }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 4px 16px 10px; flex-shrink: 0; }
.modal-q-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--sf2); border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px; font-size: 11.5px; font-weight: 600; color: var(--t2); max-width: 76%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal-q-chip .qi { color: var(--accent); flex-shrink: 0; }
.modal-close { margin-left: auto; width: 28px; height: 28px; border: 0; background: var(--sf2); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--t2); flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
.modal-close:active { background: var(--border); }
.modal-body { overflow-y: auto; padding: 0 18px 4px; flex: 1; -webkit-overflow-scrolling: touch; }
.modal-body::-webkit-scrollbar { display: none; }
.morph { animation: morphIn .32s cubic-bezier(.2,.7,.2,1); }
@keyframes morphIn { from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;} }
.m-title { font-family: var(--font-display); font-size: 26px; font-weight: 600; line-height: 1.08; letter-spacing: -.6px; margin: 4px 0 8px; color: var(--t1); }
.m-title em { font-style: italic; }
.m-text { font-size: 14px; color: var(--t2); line-height: 1.55; margin-bottom: 14px; }
.m-cards { margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
.fu-label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--t3); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
.fu-chips { display: flex; flex-direction: column; gap: 6px; padding-bottom: 18px; }
.fu-chip { display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; font-size: 13px; font-weight: 600; color: var(--t1); text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.fu-chip:active { border-color: var(--accent-mid); background: var(--accent-soft); color: var(--accent); }
.fu-chip .fi { color: var(--accent); flex-shrink: 0; }
.fu-chip .fa { margin-left: auto; color: var(--t4); }
.yesno { display: flex; gap: 8px; padding-bottom: 16px; }
.yesno button { flex: 1; padding: 14px 16px; border-radius: 14px; font-family: var(--font); font-size: 14px; font-weight: 700; cursor: pointer; border: 0; -webkit-tap-highlight-color: transparent; }
.yesno .yes { background: var(--t1); color: #FFF; }
.yesno .yes:active { background: #000; }
.yesno .no { background: var(--sf2); color: var(--t1); border: 1px solid var(--border) !important; }
.yesno .no:active { background: var(--border); }
.typing { padding: 28px 0; display: flex; justify-content: center; }
.typing-dots { display: inline-flex; gap: 5px; }
.typing-dots span { width: 9px; height: 9px; border-radius: 50%; background: var(--t3); animation: td 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: .15s; }
.typing-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes td { 0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;} }
.propose-card { background: var(--sf2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 14px; }

/* === HELPERS ================================================================ */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function sep() { return ' \u00b7 '; }

/* === CARD BUILDERS ========================================================== */
function cardPerson(c) {
  var muts = (c.mutuals || []).slice(0,3).map(function(m){ return '<span class="bzc-mut">'+esc(m)+'</span>'; }).join('');
  return '<article class="bzc" data-open-detail="person:'+esc(c.name)+'">'
    +'<div class="bzc-ph">'+avImg(c.seed,44)+'</div>'
    +'<div class="bzc-body">'
      +'<div class="bzc-name">'+esc(c.name)+'</div>'
      +'<div class="bzc-role">'+esc(c.role||'')+(c.company ? sep()+esc(c.company) : '')+'</div>'
      +(c.avail ? '<div class="bzc-meta">'+I.clock+' '+esc(c.avail)+'</div>' : '')
      +(muts ? '<div class="bzc-muts">'+muts+'</div>' : '')
    +'</div>'
    +'<div class="bzc-actions">'
      +'<button class="bzc-btn bzc-btn-primary" data-action="meet:'+esc(c.name)+'">'+I.msg+' Meet</button>'
    +'</div>'
    +'</article>';
}

function cardSession(c) {
  var tag = '';
  if (c.tag === 'live') tag = '<span class="bzc-tag bzc-tag-live"><span class="bzc-dot"></span>Live now</span>';
  else if (c.tag === 'next') tag = '<span class="bzc-tag bzc-tag-next">Up next</span>';
  var cta = c.inAgenda
    ? '<button class="bzc-btn bzc-btn-soft" data-action="remove:'+esc(c.title)+'">'+I.check+' Saved</button>'
    : '<button class="bzc-btn bzc-btn-primary" data-action="add:'+esc(c.title)+'">'+I.plus+' Add</button>';
  var speakerBit = '';
  if (c.speakerSeed) {
    speakerBit = '<div style="display:flex;align-items:center;gap:6px;margin-top:4px;">'
      +'<div style="width:20px;height:20px;border-radius:50%;overflow:hidden;flex-shrink:0;">'+avImg(c.speakerSeed,20)+'</div>'
      +'<span style="font-size:11px;color:var(--t3);">'+esc(c.speaker||'')+'</span>'
      +'</div>';
  } else if (c.speaker) {
    speakerBit = '<div class="bzc-meta">'+I.pin+' '+esc(c.room||'')+sep()+esc(c.speaker)+'</div>';
  } else {
    speakerBit = '<div class="bzc-meta">'+I.pin+' '+esc(c.room||'')+'</div>';
  }
  return '<article class="bzc bzc-session" data-open-detail="session:'+esc(c.title)+'">'
    +'<div class="bzc-time">'
      +'<div class="bzc-time-num">'+esc((c.time||'').split(':')[0]||'')+'</div>'
      +'<div class="bzc-time-min">'+esc((c.time||'').split(':')[1]||'00')+'</div>'
    +'</div>'
    +'<div class="bzc-body">'+tag+'<div class="bzc-name">'+esc(c.title)+'</div>'+speakerBit+'</div>'
    +'<div class="bzc-actions">'+cta+'</div>'
    +'</article>';
}

function cardSchedule(items) {
  var rows = items.map(function(it) {
    var tag = '';
    if (it.tag === 'live') tag = '<span class="bzc-tag bzc-tag-live"><span class="bzc-dot"></span>Live</span>';
    else if (it.tag === 'next') tag = '<span class="bzc-tag bzc-tag-next">Next</span>';
    var av = it.speakerSeed ? '<div style="display:inline-flex;align-items:center;margin-left:6px;"><div style="width:16px;height:16px;border-radius:50%;overflow:hidden;display:inline-flex;">'+avImg(it.speakerSeed,16)+'</div></div>' : '';
    return '<div class="bzc-sch-row">'
      +'<div class="bzc-sch-time">'+esc(it.time)+'</div>'
      +'<div><div class="bzc-sch-title">'+esc(it.title||'')+av+' '+tag+'</div><div class="bzc-sch-meta">'+esc(it.meta||'')+'</div></div>'
      +'</div>';
  }).join('');
  return '<article class="bzc bzc-schedule">'+rows+'</article>';
}

function renderCards(cards) {
  return cards.map(function(c) {
    if (c.type === 'speaker')  return cardSpeaker(c);
    if (c.type === 'session')  return cardSession(c);
    if (c.type === 'person')   return cardPerson(c);
    if (c.type === 'wifi')     return cardWifi();
    if (c.type === 'place')    return cardPlace(c.name, c.level, c.walkMin, c.hint);
    if (c.type === 'sponsor')  return cardSponsor(c.name, c.booth, c.hook, c.cta);
    if (c.type === 'schedule') return cardSchedule(c.items);
    return '';
  }).join('');
}

function resp(kind, title, extra) {
  var r = {kind:kind, titleHtml:title};
  if (extra) { for (var k in extra) { if (extra.hasOwnProperty(k)) r[k] = extra[k]; } }
  return r;
}

/* === MODAL RENDER =========================================================== */
function fuHtml(chips) {
  if (!chips || !chips.length) return '';
  var rows = chips.map(function(c) {
    return '<button class="fu-chip" data-prompt="'+esc(c)+'">'
      +'<span class="fi">'+I.spark+'</span>'
      +'<span>'+esc(c)+'</span>'
      +'<span class="fa">'+I.arrow+'</span>'
      +'</button>';
  }).join('');
  return '<div class="fu-label">'+I.spark+' Follow up</div><div class="fu-chips">'+rows+'</div>';
}

function tabLabel(id) {
  var t = TABS.filter(function(x){ return x.id === id; })[0];
  return t ? t.label : id;
}

function renderModalContent(r) {
  if (!r) return '';
  var h = '<div class="morph">';
  if (r.kind === 'cards') {
    h += '<div class="m-title">'+(r.titleHtml||'Here\'s what I found.')+'</div>';
    h += '<div class="m-cards">'+renderCards(r.cards||[])+'</div>';
    h += fuHtml(r.chips);

    h += '<div class="m-title">'+(r.text||'')+'</div>';
    h += '<div class="yesno">'
      +'<button class="no" data-stay>No, show here</button>'
      +'<button class="yes" data-nav="'+esc(r.target||'home')+'">Yes, open '+tabLabel(r.target)+' '+I.arrow+'</button>'
      +'</div>';
    h += fuHtml(r.chips);
  } else if (r.kind === 'chat') {
    h += '<div class="m-title">'+(r.titleHtml||'')+'</div>';
    if (r.text) h += '<div class="m-text">'+esc(r.text)+'</div>';
    h += fuHtml(r.chips);
  } else if (r.kind === 'propose') {
    h += '<div class="m-title">Quick check.</div>';
    h += '<div class="propose-card">'
      +'<div class="propose-label">'+esc(r.proposeLabel)+'</div>'
      +'<div class="propose-detail">'+esc(r.proposeDetail)+'</div>'
      +'<div class="propose-actions">'
        +'<button class="propose-dismiss" data-dismiss>'+esc(r.dismissLabel||'Not now')+'</button>'
        +'<button class="propose-confirm" data-confirm="'+esc(r.confirmAction||'')+'">'+esc(r.confirmLabel)+'</button>'

}

var BIZZY_SYS = 'You are Bizzy, in-app event assistant for Bizzabo. Warm, concise, specific.\n'
  + 'EVENT: Web Summit, Expo Tel Aviv, May 12-15 2025. Lifecycle: live.\n'
  + 'ATTENDEE: Julia, Product Designer, fintech. Interests: AI, product design, sustainability.\n'
  + 'WiFi: SSID "EventGuest_5G", password "Summit2025!"\n'
  + 'SESSIONS: 14:00 Building Sustainable Cities Auditorium A Maya Levine (LIVE); 14:30 AI in Product Design Hall B Daniel Wu (NEXT 23min); 16:00 Networking Mixer Level 1; 17:30 Closing Keynote Main Stage Sarah Chen\n'
  + 'PEOPLE: Alex Chen Senior PM Stripe free 15:30; Priya Shah Design Lead Notion available now; Ravi Mendez Founder Threadwise; Dana Goldberg Sustainability Lead Patagonia in Hall B\n'
  + 'SPONSORS: Figma Booth 12 Level 1; Stripe Booth 7 Level 1 hiring designers; Notion Booth 21 Level 1\n\n'
  + 'RESPOND IN JSON ONLY (no markdown):\n'
  + '{"kind":"cards","titleHtml":"title","cards":[...],"chips":["a","b","c"]}\n'
  + '{"kind":"chat","titleHtml":"title","text":"2-4 sentences","chips":["a","b","c"]}\n'
  + '{"kind":"nav","text":"framing","target":"agenda|network|speakers|more","chips":["a","b"]}\n'
  + '{"kind":"propose","proposeLabel":"TYPE","proposeDetail":"detail","confirmLabel":"ok","confirmAction":"id","dismissLabel":"no","chips":["a","b"]}\n'
  + '{"kind":"emergency","text":"numbers and locations","chips":["a","b"]}\n'
  + 'Card types: session,speaker,person,wifi,place,sponsor,schedule. Always 2-4 chips under 28 chars.';

function askClaude(query, callback) {
  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: BIZZY_SYS,
      messages: [{role:'user', content:'Query: '+query+'\nReturn JSON only.'}]
    })
  }).then(function(res){ return res.json(); })
  .then(function(data) {
    try {
      var raw = data.content && data.content[0] && data.content[0].text;
      if (!raw) { callback(null); return; }
      var clean = raw.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/i,'').trim();
      var m = clean.match(/\{[\s\S]*\}/);
      if (!m) { callback(null); return; }
      var parsed = JSON.parse(m[0]);
      if (!parsed.kind) { callback(null); return; }
      if (!Array.isArray(parsed.chips)) parsed.chips = [];
      parsed.chips = parsed.chips.slice(0,4);
      callback(parsed);
    } catch(e) { callback(null); }
  }).catch(function(){ callback(null); });
}

function ask(query) {
  if (!query) return;
  openModal(query);
  var done = false;
  var timer = setTimeout(function() {
    if (!done) { done = true; resolveModal(getResponse(query)); }
  }, 3500);
  askClaude(query, function(r) {
    clearTimeout(timer);
    if (!done) { done = true; resolveModal(r || getResponse(query)); }
  });
}

/* === PAGE CONTENT =========================================================== */
function renderPageContent() {
  var isHome = S.page === 'home';
  document.getElementById('anchor-wrap').style.display = isHome ? '' : 'none';
  document.getElementById('event-banner').style.display = isHome ? '' : 'none';
  document.getElementById('home-body').style.display = isHome ? '' : 'none';
  var pg = document.getElementById('page-content');
  if (isHome) { pg.innerHTML = ''; return; }
  var html = '';
  if (S.page === 'agenda') {
    html = '<div class="page-section"><div class="page-section-title">Today, May 12</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;">'
      + SESSIONS.map(function(s){ return cardSession(s); }).join('')
      + '</div></div>';
  } else if (S.page === 'network') {
    html = '<div class="page-section"><div class="page-section-title">Suggested for you</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;">'
      + PEOPLE.map(function(p){ return cardPerson(p); }).join('')
      + '</div></div>';
  } else if (S.page === 'speakers') {
    html = '<div class="page-section"><div class="page-section-title">Speaking today</div>'
      + '<div style="display:flex;flex-direction:column;gap:12px;">'
      + SPEAKERS.map(function(s){ return cardSpeakerFull(s); }).join('')
      + '</div></div>';
  } else if (S.page === 'more') {
    html = '<div class="page-section"><div class="page-section-title">Quick info</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;">'
      + cardWifi()
      + cardSponsor('Figma','Booth 12, Level 1','Live Dev Mode demos every 30 min','See booth')
      + cardSponsor('Stripe','Booth 7, Level 1','Hiring designers - talk to Alex','See booth')
      + cardSponsor('Notion','Booth 21, Level 1','Live workspace demos and swag','See booth')
      + '</div></div>';
  }
  pg.innerHTML = html;
  pg.querySelectorAll('[data-action]').forEach(bindCardAction);
  bindDetailTaps(pg);
}

/* === TAB BAR ================================================================ */
function renderTabBar() {
  document.getElementById('tab-bar').innerHTML = TABS.map(function(t) {
    return '<button class="tab '+(t.id===S.page?'on':'')+'" data-tab="'+t.id+'">'
      + t.icon + '<span>'+t.label+'</span></button>';
  }).join('');
  document.querySelectorAll('.tab').forEach(function(b) {
    b.addEventListener('click', function(){
      S.page = b.getAttribute('data-tab');
      renderTabBar();
      renderSuggestions();
      renderHomeBody();
      renderPageContent();
      document.getElementById('cs').scrollTop = 0;
    });
  });
}

/* === MODAL ================================================================== */
function openModal(query) {
  S.currentQuery = query;
  document.getElementById('modal-q-text').textContent = query;
  document.getElementById('modal').classList.add('open');
  document.getElementById('scrim').classList.add('open');
  document.getElementById('modal-body').innerHTML = '<div class="typing"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
}

function resolveModal(r) {
  var mb = document.getElementById('modal-body');
  mb.innerHTML = renderModalContent(r);
  mb.querySelectorAll('.fu-chip[data-prompt]').forEach(function(b) {
    b.addEventListener('click', function(){ ask(b.getAttribute('data-prompt')); });
  });
  mb.querySelectorAll('[data-nav]').forEach(function(b) {
    b.addEventListener('click', function() {
      S.page = b.getAttribute('data-nav');
      closeModal();
      renderTabBar(); renderSuggestions(); renderHomeBody(); renderPageContent();
    });
  });
  mb.querySelectorAll('[data-stay]').forEach(function(b) {
    b.addEventListener('click', function(){ ask('Summarise in place'); });
  });
  mb.querySelectorAll('[data-action]').forEach(bindCardAction);
  mb.querySelectorAll('[data-confirm]').forEach(function(b) {
    b.addEventListener('click', function() {
      resolveModal(resp('chat','Done.', {text:"Request sent. You will get a notification when they respond.", chips:["What's on now?","Who else to meet?","Plan my afternoon"]}));
    });
  });
  mb.querySelectorAll('[data-dismiss]').forEach(function(b) {
    b.addEventListener('click', closeModal);
  });
  bindDetailTaps(mb);
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}

/* === WIRE UP ================================================================ */
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('scrim').addEventListener('click', closeModal);
document.getElementById('detail-back').addEventListener('click', closeDetail);

var inp = document.getElementById('chat-input');
document.getElementById('send-btn').addEventListener('click', function() {
  var v = inp.value.trim(); if (!v) return; inp.value = ''; ask(v);
});
inp.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { var v = inp.value.trim(); if (!v) return; inp.value = ''; ask(v); }
});
document.getElementById('acard').addEventListener('click', function() {
  ask(this.getAttribute('data-prompt') || "What's on right now?");
});
document.getElementById('a-cta').addEventListener('click', function(e) {
  e.stopPropagation();
  ask(document.getElementById('acard').getAttribute('data-prompt') || "What's on right now?");
});
document.getElementById('reset-btn').addEventListener('click', function() {
  renderSuggestions(); renderHomeBody(); renderPageContent();
});

/* Banner avatar cluster */
var bannerAvas = document.getElementById('banner-avatars');
bannerAvas.innerHTML = [3,6,2].map(function(seed, i) {
  return '<div style="width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.7);'
    + (i > 0 ? 'margin-left:-10px;' : '') + 'box-shadow:0 2px 8px rgba(0,0,0,.2);">'
    + avImg(seed, 34) + '</div>';
}).join('');

/* Init */
renderTabBar();
renderSuggestions();
renderHomeBody();
renderPageContent();

})();
</script>
</body>
</html>
